<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potree Viewer</title>

    <link rel="stylesheet" href="./libs/potree/potree.css">
    <link rel="stylesheet" href="./libs/jquery-ui/jquery-ui.min.css">
    <link rel="stylesheet" href="./libs/openlayers3/ol.css">
    <link rel="stylesheet" href="./libs/spectrum/spectrum.css">
    <link rel="stylesheet" href="./libs/jstree/themes/mixed/style.css">
</head>

<body>
    <div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0; top: 0;">
        <div id="potree_render_area" style="background-image: url('./libs/potree/resources/images/background.jpg');"></div>
        <div id="potree_sidebar_container"></div>
    </div>

    <script src="./libs/jquery/jquery-3.1.1.min.js"></script>
    <script src="./libs/spectrum/spectrum.js"></script>
    <script src="./libs/jquery-ui/jquery-ui.min.js"></script>
    <script src="./libs/other/BinaryHeap.js"></script>
    <script src="./libs/tween/tween.min.js"></script>
    <script src="./libs/d3/d3.js"></script>
    <script src="./libs/proj4/proj4.js"></script>
    <script src="./libs/openlayers3/ol.js"></script>
    <script src="./libs/i18next/i18next.js"></script>
    <script src="./libs/jstree/jstree.js"></script>
    <script src="./libs/potree/potree.js"></script>
    <script src="./libs/plasio/js/laslaz.js"></script>

    <script>
        // Initialize Potree viewer
        const viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
        viewer.setEDLEnabled(true);
        viewer.setFOV(60);
        viewer.setPointBudget(1_000_000); // Reduced to optimize fetch volume
        viewer.loadSettingsFromURL();
        viewer.setDescription("Lion model point cloud");

        viewer.loadGUI(() => {
            viewer.setLanguage('en');
            $("#menu_appearance").next().show();
            $("#menu_tools").next().show();
            $("#menu_clipping").next().show();
            viewer.toggleSidebar();
        });

        // Hardcoded model name
        const modelName = "myviewer1";

        // Fetch the SAS URL
        fetch(`/api/getSasUrl?model=${modelName}`)
            .then(async response => {
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(`HTTP ${response.status}: ${text}`);
                }
                return response.json();
            })
            .then(data => {
                if (!data.baseUrl || !data.sasToken) {
                    throw new Error("Invalid SAS data returned - missing baseUrl or sasToken");
                }
                
                console.log("SAS data received:", {
                    baseUrl: data.baseUrl,
                    sasToken: data.sasToken.substring(0, 20) + "...",
                    model: data.model
                });
                
                // Store SAS info globally
                window.azureBaseUrl = data.baseUrl;
                window.azureSasToken = data.sasToken;
                window.azureModel = data.model;
                
                // Construct metadata URL
                const metadataUrl = `${data.baseUrl}/${data.model}/metadata.json?${data.sasToken}`;
                console.log("Constructed metadataUrl:", metadataUrl);
                
                // Override XMLHttpRequest to fix URLs
                const originalXHROpen = XMLHttpRequest.prototype.open;
                XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
                    console.log("Original URL request:", url);
                    let newUrl = url;
                    if (url.includes('.bin') || url.includes('.las') || url.includes('.laz') || 
                        url.includes('hierarchy') || url.includes('octree') || 
                        url.includes('blob.core.windows.net')) {
                        if (url.includes('../')) {
                            console.log("Fixing malformed URL with ../");
                            const parts = url.split('/');
                            const filename = parts.pop().split('?')[0];
                            newUrl = `${window.azureBaseUrl}/${window.azureModel}/${filename}?${window.azureSasToken}`;
                        } else if (!url.startsWith('http')) {
                            const cleanPath = url.replace(/^\.?\/+/, '');
                            newUrl = `${window.azureBaseUrl}/${window.azureModel}/${cleanPath}?${window.azureSasToken}`;
                        }
                        console.log("Fixed URL:", newUrl);
                    }
                    return originalXHROpen.call(this, method, newUrl, async, user, password);
                };

                // Override fetch for consistency
                const originalFetch = window.fetch;
                window.fetch = async function(url, options) {
                    console.log("Fetch request:", url);
                    let newUrl = url;
                    if (typeof url === 'string' && (url.includes('.bin') || url.includes('.las') || url.includes('.laz') || 
                        url.includes('hierarchy') || url.includes('octree') || url.includes('blob.core.windows.net'))) {
                        if (url.includes('../')) {
                            console.log("Fixing malformed fetch URL with ../");
                            const parts = url.split('/');
                            const filename = parts.pop().split('?')[0];
                            newUrl = `${window.azureBaseUrl}/${window.azureModel}/${filename}?${window.azureSasToken}`;
                        } else if (!url.startsWith('http')) {
                            const cleanPath = url.replace(/^\.?\/+/, '');
                            newUrl = `${window.azureBaseUrl}/${window.azureModel}/${cleanPath}?${window.azureSasToken}`;
                        }
                        console.log("Fixed fetch URL:", newUrl);
                    }
                    return originalFetch.call(this, newUrl, options);
                };

                // Load point cloud with a single attempt
                Potree.loadPointCloud(metadataUrl, modelName, e => {
                    console.log("Point cloud loaded successfully");
                    const scene = viewer.scene;
                    const pointcloud = e.pointcloud;
                    const material = pointcloud.material;
                    material.size = 1;
                    material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
                    material.shape = Potree.PointShape.SQUARE;
                    material.activeAttributeName = "rgba";
                    scene.addPointCloud(pointcloud);
                    viewer.fitToScreen();
                }, error => {
                    console.error("Point cloud load failed:", error);
                });
            })
            .catch(err => {
                console.error("Failed to fetch SAS URL or load point cloud:", err);
                alert("Error loading point cloud. Check console for details: " + err.message);
            });
    </script>
</body>
</html>
