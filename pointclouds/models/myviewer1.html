<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potree Viewer</title>

    <link rel="stylesheet" href="./libs/potree/potree.css">
    <link rel="stylesheet" href="./libs/jquery-ui/jquery-ui.min.css">
    <link rel="stylesheet" href="./libs/openlayers3/ol.css">
    <link rel="stylesheet" href="./libs/spectrum/spectrum.css">
    <link rel="stylesheet" href="./libs/jstree/themes/mixed/style.css">
</head>

<body>
    <div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0; top: 0;">
        <div id="potree_render_area" style="background-image: url('./libs/potree/resources/images/background.jpg');"></div>
        <div id="potree_sidebar_container"></div>
    </div>

    <script src="./libs/jquery/jquery-3.1.1.min.js"></script>
    <script src="./libs/spectrum/spectrum.js"></script>
    <script src="./libs/jquery-ui/jquery-ui.min.js"></script>
    <script src="./libs/other/BinaryHeap.js"></script>
    <script src="./libs/tween/tween.min.js"></script>
    <script src="./libs/d3/d3.js"></script>
    <script src="./libs/proj4/proj4.js"></script>
    <script src="./libs/openlayers3/ol.js"></script>
    <script src="./libs/i18next/i18next.js"></script>
    <script src="./libs/jstree/jstree.js"></script>
    <script src="./libs/potree/potree.js"></script>
    <script src="./libs/plasio/js/laslaz.js"></script>

<script>
    // Initialize Potree viewer
    const viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
    viewer.setEDLEnabled(true);
    viewer.setFOV(60);
    viewer.setPointBudget(2_000_000);
    viewer.loadSettingsFromURL();
    viewer.setDescription("Lion model point cloud");

    viewer.loadGUI(() => {
        viewer.setLanguage('en');
        $("#menu_appearance").next().show();
        $("#menu_tools").next().show();
        $("#menu_clipping").next().show();
        viewer.toggleSidebar();
    });

    // Hardcoded model name
    const modelName = "myviewer1";

    // Fetch the SAS URL
    fetch(`/api/getSasUrl?model=${modelName}`)
        .then(async response => {
            if (!response.ok) {
                const text = await response.text();
                throw new Error(`HTTP ${response.status}: ${text}`);
            }
            return response.json();
        })
        .then(data => {
            if (!data.url) throw new Error("Invalid SAS URL returned");
            
            // Debug the raw data.url
            console.log("Raw data.url:", data.url);
            
            // Use URL object for robust parsing
            const url = new URL(data.url, window.location.origin); // Ensure proper base
            const baseUrl = url.origin + url.pathname; // e.g., https://testing10294.blob.core.windows.net/example-potree
            const queryString = url.search.slice(1); // e.g., sv=2025-07-05&spr=https&...
            const metadataUrl = `${baseUrl}/${modelName}/metadata.json?${queryString}`;
            
            // Debug the constructed URL
            console.log("Constructed metadataUrl:", metadataUrl);
            Potree.loadPointCloud(metadataUrl, modelName, e => {
                const scene = viewer.scene;
                const pointcloud = e.pointcloud;

                const material = pointcloud.material;
                material.size = 1;
                material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
                material.shape = Potree.PointShape.SQUARE;
                material.activeAttributeName = "rgba";

                scene.addPointCloud(pointcloud);
                viewer.fitToScreen();
            });
        })
        .catch(err => {
            console.error("Failed to fetch SAS URL or load point cloud:", err);
            alert("Error loading point cloud. Check console for details.");
        });
</script>
</body>
</html>
