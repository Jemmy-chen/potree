name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # ✅ Optional: Add this if Potree has a build step (adjust as needed)
      # - name: Install dependencies
      #   run: npm ci

      # - name: Build project
      #   run: npm run build

      # ✅ Debug: Confirm secret is available
      - name: Check if deployment token secret is present
        run: |
          if [ -z "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" ]; then
            echo "❌ Secret AZURE_STATIC_WEB_APPS_API_TOKEN is NOT set!"
            exit 1
          else
            echo "✅ Secret AZURE_STATIC_WEB_APPS_API_TOKEN is present."
          fi

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          skip_deploy_on_missing_secrets: true # Optional: lets the workflow continue if the secret is missing
          action: "upload"
          app_location: "."          # Adjust if your index.html is inside a subfolder like "examples"
          api_location: ""           # No backend/API needed for Potree
          output_location: "."       # Use "." if you aren't building a frontend (static files only)

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
