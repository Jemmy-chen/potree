<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BHS Potree</title>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="libs/jquery-ui/jquery-ui.min.css" />
  <link rel="stylesheet" href="libs/openlayers3/ol.css" />
  <link rel="stylesheet" href="libs/jstree/themes/mixed/style.css" />
  <link rel="stylesheet" href="libs/spectrum/spectrum.css" />
  <link rel="stylesheet" href="build/potree/potree.css" />
  
  <style>
    /* Box sizing to include padding/border in width calculations */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    /* Ensure html and body take full height and allow vertical scrolling */
    html, body {
      height: 100%;
      margin: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }

    body {
      font-family: sans-serif;
      background-color: #0b1446; /* Dark navy blue background */
      color: #e0e0e0; /* Soft off-white text */
      padding: 2rem;
      min-height: 100vh;
    }

    /* Background image with dark overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: 
        linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
        url('background/wallpaper.jpg') center center / cover no-repeat;
      z-index: -1;
      pointer-events: none;
    }

    /* Main content container with max width and horizontal centering */
    #content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    h2 {
      text-align: center;
      font-weight: 700;
      font-size: 2rem;
      margin-bottom: 2rem;
      color: #d0d0d0;
      border-bottom: 3px solid #1c2a72;
      padding-bottom: 0.3rem;
      letter-spacing: 0.05em;
      display: block;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    h3 {
      color: #d0d0d0; /* section titles */

    }

    .section {
      margin-bottom: 3rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    .example {
      background: rgba(30, 30, 40, 0.85);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      margin-bottom: 1.5rem;
      backdrop-filter: saturate(180%) blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #eee;
    }

    .example:hover {
      transform: scale(1.06);
      box-shadow: 0 15px 35px rgba(0, 0, 50, 0.5);
      background: rgba(40, 40, 55, 0.95);
    }

    /* FIXED THUMBNAIL SIZE */
    .example img {
      width: 200px;       /* fixed width */
      height: 140px;      /* fixed height */
      object-fit: cover;  /* crop and fill */
      display: block;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px 16px 0 0;
      transition: filter 0.3s ease;
      filter: brightness(90%);
      margin: 0 auto;     /* center horizontally */
    }

    .example img:hover {
      filter: brightness(100%);
    }

    .example a {
      text-decoration: none;
      color: #d0d0d0;
      display: block;
      padding: 0.75rem 0.5rem;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.03em;
      background: rgba(20, 20, 30, 0.8);
      border-radius: 0 0 16px 16px;
      transition: background 0.3s ease, color 0.3s ease;
      user-select: none;
    }

    .example a:hover {
      color: #5eaaff;
      background: rgba(30, 40, 70, 0.95);
    }
    .example a > div {
  padding-top: 8px; /* or whatever space you want */
}
  </style>
</head>
<body>
  <h2>Potree 3D Viewer List</h2>
  <div id="content"></div>

  <!-- Scripts -->
  <script src="libs/jquery/jquery-3.1.1.min.js"></script>
  <script src="libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="libs/spectrum/spectrum.js"></script>
  <script src="libs/proj4/proj4.js"></script>
  <script src="libs/openlayers3/ol.js"></script>
  <script src="libs/other/BinaryHeap.js"></script>
  <script src="libs/i18next/i18next.js"></script>
  <script src="libs/d3/d3.js"></script>
  <script src="libs/plasio/js/laslaz.js"></script>
  <script src="libs/tween/tween.min.js"></script>
  <script src="libs/jstree/jstree.js"></script>
  <script src="build/potree/potree.js"></script>
  <script type="module" src="libs/three.js/build/three.module.js"></script>

  <script>
    fetch("examples/page.json")
      .then(response => response.json())
      .then(data => {
        const content = document.getElementById("content");

        for (const [section, examples] of Object.entries(data)) {
          const sectionDiv = document.createElement("div");
          sectionDiv.className = "section";

          const title = document.createElement("h3");
          title.textContent = section;
          sectionDiv.appendChild(title);

          const grid = document.createElement("div");
          grid.className = "grid";

          examples.forEach(example => {
            const div = document.createElement("div");
            div.className = "example";

            const a = document.createElement("a");
            a.href = "examples/" + example.url;
            a.title = example.label || example.url;

            const img = document.createElement("img");
            img.src = "examples/" + example.thumb;
            img.alt = example.label || example.url;

            const label = document.createElement("div");
            label.textContent = example.label || example.url;

            a.appendChild(img);
            a.appendChild(label);
            div.appendChild(a);
            grid.appendChild(div);
          });

          sectionDiv.appendChild(grid);
          content.appendChild(sectionDiv);
        }
      })
      .catch(error => {
        document.getElementById("content").textContent = "Failed to load examples.";
        console.error("Error loading page.json:", error);
      });
  </script>
</body>
</html>
